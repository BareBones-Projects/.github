name: Documentation integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documentation and preview
        run: |
          set -euo pipefail
          for f in README.md INSTALLATION.md SECURITY.md FUNDRAISING.md assets/social-preview.svg; do test -s "$f" || { echo "Missing $f"; exit 1; }; done
          grep -Fq 'BareBones Projects, Designed by: Justin Levesque-Welsch' README.md
          grep -Fq 'assets/social-preview.svg' README.md
          echo "Documentation only: project-specific tests are separate."
